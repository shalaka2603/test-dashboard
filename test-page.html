<!DOCTYPE html>
<!-- hub:tag Test -->
<!-- hub:title Test Page -->
<!-- hub:desc A simple test page to confirm uploads and deploys are working. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Page</title>
<style>
  :root{
    --bg:#F4F9F8;
    --card:#FFFFFF;
    --ink:#122B29;
    --ink-soft:#5C7472;
    --line:#DCEAE7;
    --teal:#0E6C63;
    --aqua:#12A594;
    --aqua-soft:#DDF3EF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:40px 44px;
    text-align:center;
    max-width:420px;
  }
  .badge{
    display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.05em; background:var(--aqua-soft); color:var(--teal);
    padding:4px 12px; border-radius:999px; margin-bottom:16px;
  }
  h1{ margin:0 0 10px; font-size:22px; }
  p{ margin:0; font-size:14px; color:var(--ink-soft); line-height:1.6; }
  .stamp{ margin-top:20px; font-size:12px; color:var(--ink-soft); }
</style>
</head>
<body>

  <div class="card">
    <span class="badge">Test</span>
    <h1>✅ It works!</h1>
    <p>If you can see this page, your upload and deployment pipeline is working correctly.</p>
    <div class="stamp">test-page.html — safe to delete anytime</div>
  </div>

</body>
</html>
